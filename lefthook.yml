pre-commit:
  jobs:
    - run: pnpm exec ultracite fix
      glob:
        - "**/*.js"
        - "**/*.jsx"
        - "**/*.mjs"
        - "**/*.ts"
        - "**/*.tsx"
        - "**/*.mts"
        - "**/*.json"
        - "**/*.jsonc"
        - "**/*.css"
      stage_fixed: true

commit-msg:
  jobs:
    - run: pnpm exec commitlint --edit {1}
