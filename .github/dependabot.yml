version: 2
updates:
  # pnpm workspaces are resolved from the root lockfile, so one entry at "/"
  # covers every app, package, and module.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Titles are Conventional Commits, so a squash merge passes the PR title
    # check: chore(deps): bump …
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    # Majors stay one PR each: they need their own review.
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Keeps the commit-SHA pins (and their `# vX.Y.Z` comments) in ci.yml current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # ci(deps): bump … — the actions pins are CI, not product dependencies.
    commit-message:
      prefix: "ci"
