name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    # A repository made from the template has no release App until
    # scripts/github/create-release-app.mjs runs, yet its first commit already
    # pushes to main. Skip until the App exists instead of failing.
    if: vars.RELEASE_APP_CLIENT_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The Release PR must trigger CI, which a GITHUB_TOKEN-authored PR does
      # not; a GitHub App token does. Nothing is published, so no publish job.
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .github/release-please-config.json
          manifest-file: .release-please-manifest.json
