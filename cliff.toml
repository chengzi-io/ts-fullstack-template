# git-cliff configuration — https://git-cliff.org/docs/configuration
# Renders GitHub Release notes only (no CHANGELOG.md in the repository).

[bump]
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.1.0"

[changelog]
body = """{% for group, commits in commits | group_by(attribute="group") -%}
### {{ group | striptags | trim }}

{% for commit in commits -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{% if commit.breaking and commit.breaking_description %}{{ commit.breaking_description | split(pat="\n") | first | trim }}{% else %}{{ commit.message | split(pat="\n") | first | trim }}{% endif %}
{% endfor %}
{% endfor -%}
{% if remote.github.owner and remote.github.repo and previous.version and version -%}
**Full Changelog**: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/compare/{{ previous.version }}...{{ version }}
{% endif -%}"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
commit_parsers = [
  { field = "breaking", pattern = "true", group = "<!-- 0 -->Breaking Changes" },
  { message = "^feat", group = "<!-- 1 -->Features" },
  { message = "^fix", group = "<!-- 2 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^revert", group = "<!-- 4 -->Reverts" },
  { message = "^refactor", group = "<!-- 5 -->Refactoring" },
  { message = "^build", group = "<!-- 6 -->Build System" },
  { message = "^docs", group = "<!-- 7 -->Documentation" },
  { message = ".*", skip = true },
]
filter_commits = true
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
sort_commits = "oldest"
