# git-cliff configuration — https://git-cliff.org/docs/configuration
# Renders GitHub Release notes only (no CHANGELOG.md in the repository).

[bump]
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.1.0"

[changelog]
body = """
{%- set breaking = commits | filter(attribute="breaking", value=true) -%}
{% if breaking | length > 0 -%}
### Breaking Changes
{% for commit in breaking %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{% if commit.breaking_description %}{{ commit.breaking_description | split(pat="\n") | first | trim }}{% else %}{{ commit.message | split(pat="\n") | first | trim }}{% endif %} ({{ commit.id | truncate(length=7, end="") }})
{%- endfor %}

{% endif -%}
{% for group, commits in commits | group_by(attribute="group") -%}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim }} ({{ commit.id | truncate(length=7, end="") }})
{%- endfor %}

{% endfor -%}
{% if remote.github.owner and remote.github.repo and previous.version and version -%}
**Full Changelog**: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/compare/{{ previous.version }}...{{ version }}
{% endif -%}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^build", group = "<!-- 4 -->Build System" },
  { message = "^revert", group = "<!-- 5 -->Reverts" },
  { message = "^docs", group = "<!-- 6 -->Documentation" },
  { message = "^chore\\(main\\): release", skip = true },
  { message = "^chore\\(deps", skip = true },
  { message = "^ci\\(deps", skip = true },
  { message = "^chore|^ci|^style|^test", skip = true },
]
filter_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
