packages:
  - "apps/*"
  - "packages/*"
  - "modules/*"

allowBuilds:
  esbuild: true
  msw: false

# @hookform/resolvers imports zod without declaring it as a peer; without
# this it resolves whatever zod happens to be hoisted.
packageExtensions:
  "@hookform/resolvers":
    peerDependencies:
      zod: "^4.0.0"

# Patched versions of transitive dev-tool dependencies whose parents still
# pin a vulnerable release (high severity). Same major only; drop an entry
# once its parent ships the fix.
overrides:
  brace-expansion@5: ^5.0.12
  browserslist@4: ^4.28.7
  fast-uri@3: ^3.1.9
  js-yaml@4: ^4.3.2
  source-map-js@1: ^1.2.2
