<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2318181b'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23fafafa'/%3E%3C/svg%3E"
      rel="icon"
      type="image/svg+xml"
    />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>App</title>
    <script>
      try {
        var theme = localStorage.getItem("theme");
        var resolved =
          theme === "dark" || theme === "light"
            ? theme
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.classList.remove("light", "dark");
        document.documentElement.classList.add(resolved);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
